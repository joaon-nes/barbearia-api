name: Backend
on:
  push:
    paths: ['api/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - run: bash mvnw --batch-mode verify
        working-directory: api
