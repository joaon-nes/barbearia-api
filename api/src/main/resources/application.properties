# CONFIGURAÇÕES DE SERVIDOR

server.port=${PORT:8080}

# BANCO DE DADOS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SEGURANÇA E INTEGRAÇÕES
jwt.secret=${JWT_SECRET}
abacatepay.api.key=${ABACATEPAY_API_KEY}

# CONFIGURAÇÕES DE EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# CORS: origens exatas, separadas por vírgula. Autenticação via Bearer, sem cookies.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
abacatepay.webhook.secret=${ABACATEPAY_WEBHOOK_SECRET}
abacatepay.webhook.signature-key=${ABACATEPAY_WEBHOOK_SIGNATURE_KEY}
abacatepay.dev-mode=${ABACATEPAY_DEV_MODE:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
